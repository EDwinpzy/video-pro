plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// 复验/联调可临时抬高版本号打一个升级包（-PapkVersionCode / -PapkVersionName），不必改死代码。
def apkVersionCodeOverride = project.findProperty('apkVersionCode')
def apkVersionNameOverride = project.findProperty('apkVersionName')
// Match release runtime performance for on-device acceptance without changing release services/signing.
def projectorRuntime = project.findProperty('projectorRuntime')?.toString()?.toBoolean() ?: false
def releaseStorePassword = project.findProperty('OTV_RELEASE_STORE_PASSWORD') ?: System.getenv('OTV_RELEASE_STORE_PASSWORD') ?: ''
def releaseKeyPassword = project.findProperty('OTV_RELEASE_KEY_PASSWORD') ?: System.getenv('OTV_RELEASE_KEY_PASSWORD') ?: ''
def qaDebugKeystore = project.findProperty('qaDebugKeystore') ?: System.getenv('VP_QA_DEBUG_KEYSTORE')
android {
    namespace 'com.qiubo.optimaltv'
    compileSdk 35
    testOptions { unitTests.includeAndroidResources = true }

    defaultConfig {
        // v1.19 版本重规划（2026-09-03）：只保留原公测版一条线，命名「TV 版」。
        // 包名沿用公测版 com.qiubo.optimaltv.public——老公测用户直接覆盖升级
        applicationId "com.dongpiandi.videopro"
        // 技术方案 §4.2：坚果 N1 Air = Bonfire OS / Android 11 → minSdk 30，零 GMS 依赖
    minSdk 30
    targetSdk 34
    // ---- 版本号规则（2026-11-05 恢复正式前端后）----
    // 0.3.0 / 6 由实验 KMP TV 壳发布；本目录是恢复后的正式前端，必须保持
    // versionName 与 versionCode 都严格高于已发布版本。
    // 使用 MAJOR.MINOR.PATCH；versionCode 为独立严格递增整数，不再使用公式。
    // 版本规则见 docs/versioning.md；发布前只在本文件修改这两个值。
    versionCode(apkVersionCodeOverride ? Integer.parseInt(apkVersionCodeOverride.toString()) : 10)
    versionName(apkVersionNameOverride ? apkVersionNameOverride.toString() : "1.0.0")
        // 方案 §5：双 ABI split 思路——真机 arm64/v7a + 模拟器 x86_64（开发验证用）
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        // AOSP 谷歌拼音解码器（搜索页拼音候选，2026-08-29）；默认 c++_static（new/delete 需要 libc++）
        // v1.19 版本重规划：内测/公测双 flavor 退役——只保留一条正式分发线（原公测版）。
        // 2026-09-19 老板要求：**桌面应用名不带「TV版/移动版」**，两端统一 'My TV'；
        // 区分只保留在 APK 产物文件名（MyTV-TV版.apk / MyTV-移动版.apk，见文件末尾归档块）。
        // 注意：两端 label 相同，故**同一台设备不要同时装 TV 版与移动版**（靠 applicationId
        // 可以共存，但桌面会出现两个同名图标），分发时按设备类型二选一。
        resValue 'string', 'app_name', 'Video Pro'
        manifestPlaceholders += [
                networkSecurityConfig: '@xml/network_security_config',
        ]
        // 启动门闸预算：TV 90s（用户要求全加载完再进，遥控场景可等）；App.kt 共享读取。
        // 2026-09-03 事故教训见 mobile 的 30000 注释
        buildConfigField 'long', 'STARTUP_GATE_MS', '90000'

        // 焦点导航仪器测试（2026-09-06 三层测试体系第二层）：自定义 Runner 换轻量
        // FocusTestApp（绕开 App.kt 的启动门闸），harness 见
        // androidTest/.../focus/。真实按键注入（Espresso sendKeySync → Activity
        // .dispatchKeyEvent → OtvNav.dispatch）+ assertIsFocused 语义断言。
        testInstrumentationRunner 'com.qiubo.optimaltv.focus.FocusTestRunner'

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14 -fexceptions"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/pinyinime/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        create("qaDebug") {
            if (qaDebugKeystore) {
                storeFile file(qaDebugKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            // 发布签名（2026-08-27 生成，10 年有效期；上架商店若换自有签名须先卸载旧包）
            storeFile file("../optimaltv-release.keystore")
            storePassword releaseStorePassword
            keyAlias "optimaltv"
            keyPassword releaseKeyPassword
            // v1.39（2026-09-22）：补 v1 签名。minSdk 30 时 AGP 默认只出 v2，
            // 但投影仪定制 ROM 的包解析器/安装器常读不了 v2-only 包（表现为
            // 更新包校验反复失败、不停重新下载）；v1+v2 双签是 TV 分发的兼容底线。
            // 签名证书不变（601F…BA43），已装版本可直接覆盖升级。
            enableV1Signing = true
            enableV2Signing = true
            v1SigningEnabled = true
            v2SigningEnabled = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // 反射（引擎/Room）保守不混淆
            signingConfig signingConfigs.release
        }
        debug {
            debuggable !projectorRuntime
            if (qaDebugKeystore) {
                signingConfig signingConfigs.qaDebug
            }
        }
    }

    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // Compose 1.5.14 still defaults strong skipping off. It lets stable
        // lambdas and equal data-class arguments skip unchanged subtrees, which
        // matters most on the S621 where every tab switch remeasures a poster row.
        freeCompilerArgs += [
                '-P', 'plugin:androidx.compose.compiler.plugins.kotlin:strongSkipping=true',
                '-P', 'plugin:androidx.compose.compiler.plugins.kotlin:nonSkippingGroupOptimization=true',
        ]
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packagingOptions {
        resources { excludes += ['META-INF/{AL2.0,LGPL2.1}'] }
        // v1.8：libVLC 兜底引擎带入三 ABI so（~140MB 未压缩）——legacy 打包压缩之，
        // 代价仅首次启动多一步解压（TV 盒子一次性）
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// 统一产物到项目目录（v1.19 版本重规划定稿）：apk/TV版/ 固定名 MyTV-TV版.apk，
// 由 assembleRelease 复制（对外分发=签名产物）。
// debug 测试包不进 apk/——直接用项目根 build 构建输出目录。
tasks.register("copyTvApk", Copy) {
    from(layout.buildDirectory.file("outputs/apk/release/app-release.apk"))
    into(rootProject.file("../apk/TV版"))
    rename { "MyTV-TV版.apk" }
}
// AGP 的 assemble 任务在 android 插件注册后才出现，须在 afterEvaluate 挂接依赖
afterEvaluate {
    tasks.matching { it.name == "assembleRelease" }.configureEach { finalizedBy("copyTvApk") }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // 注：androidx.tv:tv-foundation 已被上游以 Kotlin 2.1 元数据重发布，
    // 与本工程锁定工具链(Kotlin 1.9.24)不兼容；网格用 foundation LazyVerticalGrid，
    // D-pad 滚动行为一致（技术方案 §3.4 的 TvLazyVerticalGrid 等价替代）。

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // 播放引擎层（技术方案 §3.2）：Media3 默认内核；VLC 兼容兜底内核。
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-datasource:1.5.1'
    // libVLC 兜底引擎（v1.8 2026-08-30）：自带完整 ffmpeg 软解——模拟器/个别盒子的
    // MediaCodec 全系解不动 AVC High(8x8+CABAC) 压段（SoftAVCDec Fatal 0xffffffff），
    // VLC 关闭其 mediacodec 硬解后用自带 avcodec 软解，任何设备都能出画面
    implementation 'org.videolan.android:libvlc-all:3.7.2'

    // 数据层（技术方案 §3.5）：Room 三表 + DataStore KV
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // 图片：Coil 内存/磁盘双缓存（低内存机限额见 App.kt）
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 焦点导航几何规则（NavGeom）JVM 单元测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    testImplementation 'org.json:json:20240303'

    // 焦点导航仪器测试（第二层）：Compose ui-test 的 performKeyInput 经 Espresso
    // sendKeySync 注入真按键，走 Activity.dispatchKeyEvent 全链路（与遥控器同路径）
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    // AndroidX Test invokes forceEnableAppTracing, which is absent from tracing 1.0.0.
    implementation 'androidx.tracing:tracing:1.2.0'
    // Espresso.pressKey = 窗口级按键注入（instrumentation.sendKeySync → Activity
    // .dispatchKeyEvent → OtvNav）；compose 的 performKeyInput 直注 Compose 层测不了引擎
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
